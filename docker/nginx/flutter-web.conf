# Nginx para servir o build do Flutter Web (build/web).
#
# O Dockerfile deste repositório já embute este arquivo na imagem:
#   docker compose up --build -d      # http://localhost:8080
#
# O `scripts/web.ps1` monta este arquivo em um container avulso, servindo o
# `build/web` compilado no host:
#   docker run --rm -p 8080:80 \
#     -v "$PWD/build/web:/usr/share/nginx/html:ro" \
#     -v "$PWD/docker/nginx/flutter-web.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginx:1.27-alpine

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # O GoRouter usa rotas de caminho (/client/home, /owner/dashboard...).
    # Sem este fallback, abrir ou recarregar uma rota direta retorna 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prefixo de versão do build. O `index.html` (que nunca é cacheado) declara
    # `<base href="/v/<hash>/">`, então o navegador pede TODOS os arquivos —
    # JS, fontes e demais assets — sob um caminho inédito a cada build. Aqui o
    # prefixo é removido e o arquivo real é servido.
    #
    # Isso existe porque o Flutter Web usa nomes fixos (`main.dart.js`,
    # `MaterialIcons-Regular.otf`): sem um caminho versionado, um cache antigo
    # continua entregando o bundle — ou a fonte de ícones — de builds passados.
    location ~ ^/v/[0-9a-f]+/(.*)$ {
        try_files /$1 /$1/ /index.html;
    }

    # ATENÇÃO: o Flutter Web **não** coloca hash nos nomes dos arquivos. A saída
    # do build é sempre `main.dart.js`, `flutter.js`, `flutter_bootstrap.js`,
    # `assets/...` — nomes fixos que mudam de conteúdo a cada compilação.
    #
    # Por isso `Cache-Control: immutable` é errado aqui: ele manda o navegador
    # nem revalidar, e o app novo fica invisível até o cache expirar. Foi
    # exatamente o que aconteceu — o navegador seguiu rodando um `main.dart.js`
    # antigo mesmo com o servidor entregando o novo.
    #
    # A estratégia correta com nomes estáveis é revalidar sempre. O ETag do
    # nginx resolve em um 304 barato quando nada mudou.

    # Pontos de entrada: nunca guardados.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-store, must-revalidate" always;
    }

    # Demais estáticos: podem ficar em cache, mas sempre revalidando.
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?|ttf|otf|wasm|json)$ {
        add_header Cache-Control "no-cache" always;
        access_log off;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/wasm;
    gzip_min_length 1024;
}

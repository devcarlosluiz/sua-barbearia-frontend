name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: App (Flutter)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Formatação
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test --coverage

      - name: Build Web
        run: flutter build web --release --dart-define=API_BASE_URL=https://api.suabarbearia.com.br

      - uses: actions/upload-artifact@v4
        with:
          name: sua-barbearia-web
          path: build/web

  docker:
    name: Imagem web (Nginx)
    runs-on: ubuntu-latest
    needs: [flutter]

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build da imagem
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: sua-barbearia/web:${{ github.sha }}
          build-args: |
            API_BASE_URL=https://api.suabarbearia.com.br
            PWA_STRATEGY=offline-first
          cache-from: type=gha
          cache-to: type=gha,mode=max
